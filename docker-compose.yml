services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp123
      POSTGRES_DB: erp
    ports:
      - "5433:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://erp:erp123@postgres:5432/erp
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@erp.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  erp_pgdata:
